name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  source-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Test the source-layout gate and audit the checkout
        run: sh tools/check.sh
