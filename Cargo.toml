[package]
name = "lom"
version = "0.1.0"
edition = "2024"
rust-version = "1.96.1"
description = "A native Sophia desktop shell inspired by ironbar"
license = "BSD-3-Clause"
repository = "https://github.com/sophia-org/lom"
publish = false

[workspace]
members = ["crates/shell-gpu"]
resolver = "3"

[lints.rust]
missing_docs = "warn"

[features]
# Diagnostic only: builds `lom-cpu-reference` and its Vello CPU copy reference.
# Off by default; the ordinary `lom` binary refuses that renderer even when on.
diagnostic-cpu-reference = []

[[bin]]
name = "lom-cpu-reference"
path = "src/bin/lom-cpu-reference.rs"
required-features = ["diagnostic-cpu-reference"]

[dependencies]
libc = "0.2"
signal-hook = "0.3.18"
sophia-shell-gpu = { path = "crates/shell-gpu" }
kdl = { version = "=6.7.1", default-features = false, features = ["span"] }
chrono = { version = "0.4.42", default-features = false, features = ["std"] }
xilem_masonry = { git = "https://github.com/linebender/xilem", rev = "b81d8d7a631849def6eeab282561439b963862e5", default-features = false }
masonry = { git = "https://github.com/linebender/xilem", rev = "b81d8d7a631849def6eeab282561439b963862e5", default-features = false }
tokio = { version = "1.50", features = ["rt", "sync"] }
wgpu = { version = "28.0", default-features = false, features = ["vulkan", "wgsl", "std", "parking_lot"] }
imaging_vello_cpu = "0.0.1"
image = { version = "0.25.10", default-features = false, features = ["png"] }
# Published SDK revision 99b05e34 (owned ring fills 5d895652 plus parity docs)
# on the cpu/owned-fill branch of sophia-desktop-sdk-rs; not merged to master.
sophia-shell-protocol = { git = "https://github.com/sophia-org/sophia-desktop-sdk-rs", rev = "99b05e345be34678128733bf0166ded85b06239a" }
sophia-shell-client = { git = "https://github.com/sophia-org/sophia-desktop-sdk-rs", rev = "99b05e345be34678128733bf0166ded85b06239a" }
sophia-launch-client = { git = "https://github.com/sophia-org/sophia-desktop-sdk-rs", rev = "99b05e345be34678128733bf0166ded85b06239a" }
sophia-9p-client = { git = "https://github.com/sophia-org/sophia-desktop-sdk-rs", rev = "99b05e345be34678128733bf0166ded85b06239a" }
sophia-image-producer = { git = "https://github.com/sophia-org/sophia-desktop-sdk-rs", rev = "99b05e345be34678128733bf0166ded85b06239a" }

[dev-dependencies]
masonry_testing = { git = "https://github.com/linebender/xilem", rev = "b81d8d7a631849def6eeab282561439b963862e5", default-features = false }


