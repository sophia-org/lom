[package]
name = "lom"
version = "0.1.0"
edition = "2024"
rust-version = "1.96.1"
description = "A native Sophia desktop shell inspired by ironbar"
license = "BSD-3-Clause"
repository = "https://github.com/sophia-org/lom"
publish = false

[workspace]
members = ["crates/shell-gpu"]
resolver = "3"

[lints.rust]
missing_docs = "warn"

[dependencies]
libc = "0.2"
signal-hook = "0.3.18"
sophia-shell-gpu = { path = "crates/shell-gpu" }
kdl = { version = "=6.7.1", default-features = false, features = ["span"] }
chrono = { version = "0.4.42", default-features = false, features = ["std"] }
xilem_masonry = { git = "https://github.com/linebender/xilem", rev = "b81d8d7a631849def6eeab282561439b963862e5", default-features = false }
masonry = { git = "https://github.com/linebender/xilem", rev = "b81d8d7a631849def6eeab282561439b963862e5", default-features = false }
tokio = { version = "1.50", features = ["rt", "sync"] }
wgpu = { version = "28.0", default-features = false, features = ["vulkan", "wgsl", "std", "parking_lot"] }
imaging_vello_cpu = "0.0.1"
image = { version = "0.25.10", default-features = false, features = ["png"] }
# Local development exception: owned ring fills (code 5d895652, parity docs
# 99b05e34) exist only in a local SDK checkout. Not a packaging or upstream
# reachability claim; restore a published revision before release.
sophia-shell-protocol = { git = "file:///home/niltempus/dev/sdk-rs-cpu-owned-fill", rev = "99b05e345be34678128733bf0166ded85b06239a" }
sophia-shell-client = { git = "file:///home/niltempus/dev/sdk-rs-cpu-owned-fill", rev = "99b05e345be34678128733bf0166ded85b06239a" }
sophia-launch-client = { git = "file:///home/niltempus/dev/sdk-rs-cpu-owned-fill", rev = "99b05e345be34678128733bf0166ded85b06239a" }
sophia-9p-client = { git = "file:///home/niltempus/dev/sdk-rs-cpu-owned-fill", rev = "99b05e345be34678128733bf0166ded85b06239a" }
sophia-image-producer = { git = "file:///home/niltempus/dev/sdk-rs-cpu-owned-fill", rev = "99b05e345be34678128733bf0166ded85b06239a" }

[dev-dependencies]
masonry_testing = { git = "https://github.com/linebender/xilem", rev = "b81d8d7a631849def6eeab282561439b963862e5", default-features = false }


